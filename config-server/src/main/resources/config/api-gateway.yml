server:
  port: 8060

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka


spring:
  cloud:
    gateway:
      routes:
        #Users-service
        -id: users-service
        uri: lb://users-service
        predicates:
          -Path=/api/v1/auth/**, /api/v1/account/**, /api/v1/profile/**, api/v1/settings/**