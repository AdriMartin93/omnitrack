# CONFIGURACION DE BASE DE DATOS (MySQL)
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/omnitrak_users_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  # CONFIGURACION DE JPA / HIBERNATE
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # CONFIGURACION DE REDIS
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 60000

  # CONFIGURACION DE CORREO (SMTP)
  mail:
    host: smtp-relay.brevo.com
    port: 587
    username: adrianm1993@gmail.com
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

# CONFIGURACION DE SPRING CLOUD (EUREKA CLIENT)
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

# ACTUATOR (MONITORIZACION)
management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics
  endpoint:
    health:
      show-details: always

# SEGURIDAD Y JWT
jwt:
  secret: ${JWT_SECRET:OmniTrakSecretKeyParaFirmarTokensJwtDePrueba2026SecurityKey}
  expiration-ms: 3600000
  refresh-expiration-ms: 604800000

# CONFIGURACIONES PROPIAS DE LA APLICACION
app:
  mail:
    activation-url: http://localhost:8081/api/v1/auth/activate?token=
    reset-password-url: http://localhost:8081/api/v1/auth/reset-password?token=
    from: adrianma1993@gmail.com